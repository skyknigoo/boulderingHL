<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧗‍♂️ 抱石影片紀錄庫 (YouTube 版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #faf8f5;
      color: #2d3748;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f0ea;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md border-b border-stone-200/80 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3.5">
        <div class="bg-red-600 p-3 rounded-2xl text-white shadow-sm">
          <i class="fa-brands fa-youtube text-xl font-normal"></i>
        </div>
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-stone-800 flex items-center gap-3">
            抱石影片紀錄
            <span class="text-xs sm:text-sm font-medium bg-red-50 text-red-600 border border-red-200 px-3 py-1 rounded-full">YouTube 頻道同步版</span>
          </h1>
          <p class="text-xs sm:text-sm text-stone-500 font-normal mt-0.5">高畫質順暢串流 · 自動同步頻道所有播放清單</p>
        </div>
      </div>

      <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
        <button id="api-config-btn" onclick="openConfigModal()" class="flex items-center gap-2 bg-stone-100 hover:bg-stone-200/80 text-stone-700 text-sm font-semibold px-4 py-2.5 rounded-xl transition border border-stone-200">
          <i class="fa-solid fa-key text-amber-600"></i>
          <span>API 金鑰與頻道設定</span>
        </button>
        <button id="refresh-btn" onclick="fetchYouTubeData()" class="flex items-center gap-2 bg-stone-800 hover:bg-stone-700 text-white text-sm px-5 py-2.5 rounded-xl transition font-bold shadow-sm">
          <i class="fa-solid fa-arrows-rotate" id="refresh-icon"></i>
          <span>同步 YT 頻道資料</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <div id="demo-mode-banner" class="bg-amber-50/80 border border-amber-200 rounded-2xl p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 text-amber-900 text-sm shadow-sm">
      <div class="flex items-center gap-3.5">
        <i class="fa-solid fa-circle-info text-amber-600 text-2xl flex-shrink-0"></i>
        <div>
          <strong class="font-bold text-amber-950 text-base">目前為「離線預覽範例模式」</strong>
          <span class="block text-amber-800/90 text-sm mt-0.5">點擊右上角「API 金鑰與頻道設定」輸入您的 Google API Key 與頻道 ID 即可同步所有播放清單！</span>
        </div>
      </div>
      <button onclick="openConfigModal()" class="whitespace-nowrap bg-amber-600 text-white font-bold px-4 py-2 rounded-xl hover:bg-amber-700 transition text-sm shadow-sm">
        設定頻道資訊
      </button>
    </div>

    <!-- Filter Control Panel -->
    <section class="bg-white rounded-2xl p-6 border border-stone-200/80 shadow-sm space-y-6">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-stone-100 pb-5">
        <h2 class="text-base sm:text-lg font-bold text-stone-700 tracking-wide flex items-center gap-2">
          <i class="fa-solid fa-sliders text-stone-500 text-lg"></i> 影片多維度動態篩選
        </h2>
        
        <div class="flex items-center gap-3 w-full md:w-auto">
          <div class="relative flex-1 md:w-72">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 text-sm"></i>
            <input type="text" id="search-input" oninput="handleSearch()" placeholder="搜尋關鍵字 (如：桃石, 嘉...)" class="w-full bg-stone-50 border border-stone-200 rounded-xl pl-10 pr-4 py-2 text-sm text-stone-800 placeholder-stone-400 focus:outline-none focus:border-stone-400 focus:bg-white transition">
          </div>
          <button onclick="resetFilters()" class="text-sm font-medium text-stone-600 hover:text-stone-900 flex items-center gap-2 px-3.5 py-2 rounded-xl border border-stone-200 hover:border-stone-300 bg-stone-50 transition">
            <i class="fa-solid fa-rotate-left text-xs"></i> 重置篩選
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4" id="filters-wrapper"></div>

      <div id="active-tags-container" class="flex flex-wrap items-center gap-2 pt-1 text-sm text-stone-600 min-h-[32px]">
        <span class="font-medium text-stone-400">已選條件：</span>
        <div id="active-tags" class="flex flex-wrap gap-2"></div>
      </div>
    </section>

    <!-- Stats Bar -->
    <div class="flex justify-between items-center text-sm font-medium text-stone-500 px-1">
      <div>共顯示 <span id="displayed-count" class="font-bold text-stone-800 text-base">0</span> / <span id="total-count" class="font-bold text-stone-800 text-base">0</span> 支影片</div>
      <div id="channel-info" class="text-stone-400 truncate max-w-xs sm:max-w-md">頻道狀態: 未連線</div>
    </div>

    <!-- Video Grid -->
    <section id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></section>

  </main>

  <!-- Video Modal -->
  <div id="video-modal" class="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm hidden flex items-center justify-center p-2 sm:p-4 transition-all duration-300">
    <div id="modal-container" class="bg-white border border-stone-200 rounded-2xl overflow-hidden max-w-4xl w-full shadow-2xl relative flex flex-col max-h-[92vh] transition-all duration-300">
      <div class="p-4 border-b border-stone-100 flex justify-between items-center bg-stone-50/80">
        <div id="modal-title" class="font-bold text-stone-800 text-base sm:text-lg truncate">影片播放</div>
        <div class="flex items-center gap-2">
          <div class="flex bg-stone-200/60 p-1 rounded-xl text-xs font-semibold">
            <button onclick="resizeModal('small')" class="px-2.5 py-1 rounded-lg text-stone-600 hover:bg-white">小</button>
            <button onclick="resizeModal('medium')" class="px-2.5 py-1 rounded-lg text-stone-900 font-bold bg-white shadow-sm">中</button>
            <button onclick="resizeModal('large')" class="px-2.5 py-1 rounded-lg text-stone-600 hover:bg-white">大</button>
            <button onclick="resizeModal('full')" class="px-2.5 py-1 rounded-lg text-stone-600 hover:bg-white"><i class="fa-solid fa-expand"></i></button>
          </div>
          <button onclick="closeVideoModal()" class="text-stone-400 hover:text-stone-700 p-2 rounded-xl hover:bg-stone-100">
            <i class="fa-solid fa-xmark text-2xl"></i>
          </button>
        </div>
      </div>
      <div class="relative w-full aspect-video bg-black flex-shrink-0">
        <iframe id="modal-iframe" src="" class="w-full h-full border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div id="modal-footer" class="p-4 bg-stone-50 border-t border-stone-100 text-sm text-stone-700 flex flex-wrap gap-2 items-center justify-between"></div>
      <div class="p-4 bg-white border-t border-stone-100 space-y-3 overflow-y-auto custom-scrollbar flex-1">
        <h4 class="text-sm font-bold text-stone-700 flex items-center gap-2">
          <i class="fa-solid fa-users-viewfinder text-stone-500"></i> 相同路線的其他攀爬者影片：
        </h4>
        <div id="same-route-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
      </div>
    </div>
  </div>

  <!-- Config Modal -->
  <div id="config-modal" class="fixed inset-0 z-50 bg-stone-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white border border-stone-200 rounded-2xl max-w-lg w-full p-6 space-y-5 shadow-2xl relative">
      <div class="flex justify-between items-center border-b border-stone-100 pb-3">
        <h3 class="text-lg font-bold text-stone-800 flex items-center gap-2">
          <i class="fa-brands fa-youtube text-red-600"></i> YouTube API & 頻道設定
        </h3>
        <button onclick="closeConfigModal()" class="text-stone-400 hover:text-stone-700">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <div class="space-y-4 text-sm text-stone-700">
        <div>
          <label class="block mb-1.5 font-semibold text-stone-800">Google API Key</label>
          <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-stone-800 text-sm focus:outline-none focus:border-stone-400 font-mono">
        </div>
        <div>
          <label class="block mb-1.5 font-semibold text-stone-800">YouTube 頻道 ID 或 @Handle</label>
          <input type="text" id="channel-id-input" placeholder="例如：UCUFu4m0t1GNp4ZKYAnsODJg 或 @skykingoo" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-stone-800 text-sm focus:outline-none focus:border-stone-400 font-mono">
          <p class="text-xs text-stone-400 mt-1">程式會自動掃描該頻道下「所有播放清單」當作場館紀錄</p>
        </div>
      </div>
      <div class="flex justify-end gap-3 pt-2">
        <button onclick="closeConfigModal()" class="px-5 py-2.5 bg-stone-100 hover:bg-stone-200 rounded-xl text-sm font-semibold transition">取消</button>
        <button onclick="saveConfig()" class="px-5 py-2.5 bg-stone-800 hover:bg-stone-700 text-white rounded-xl text-sm font-bold transition">儲存並同步</button>
      </div>
    </div>
  </div>

  <script>
    const DEMO_VIDEOS = [
      { id: "dQw4w9WgXcQ", name: "C面 桃石 V1 嘉", folderName: "260719 攀呐", thumbnail: "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" },
      { id: "dQw4w9WgXcQ", name: "1F 橘石2 挑戰 嘉", folderName: "20260726 B-Plus(太原店)", thumbnail: "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" }
    ];

    let apiKey = localStorage.getItem('yt_boulder_api_key') || '';
    let channelId = localStorage.getItem('yt_boulder_channel_id') || '';
    let rawVideoList = [];
    let parsedVideoList = [];
    
    let activeFilters = { gymDate: 'ALL', person: 'ALL', difficulty: 'ALL', color: 'ALL', wall: 'ALL' };
    let searchQuery = '';

    const colorStyleMap = {
      '桃石': 'bg-rose-50 text-rose-700 border-rose-200',
      '紅石': 'bg-red-50 text-red-700 border-red-200',
      '綠石': 'bg-emerald-50 text-emerald-700 border-emerald-200',
      '橘石': 'bg-orange-50 text-orange-700 border-orange-200',
      '藍石': 'bg-sky-50 text-sky-700 border-sky-200',
      '淺黃石': 'bg-amber-50 text-amber-700 border-amber-200',
      '黃石': 'bg-yellow-50 text-yellow-800 border-yellow-200',
      '黑石': 'bg-stone-800 text-stone-100 border-stone-800',
      '紫石': 'bg-purple-50 text-purple-700 border-purple-200',
      '粉紅石': 'bg-pink-50 text-pink-700 border-pink-200'
    };

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('api-key-input').value = apiKey;
      document.getElementById('channel-id-input').value = channelId;

      if (apiKey && channelId) {
        document.getElementById('demo-mode-banner').classList.add('hidden');
        fetchYouTubeData();
      } else {
        loadDemoData();
      }
    });

    function loadDemoData() {
      rawVideoList = DEMO_VIDEOS;
      processVideoData();
    }

    function parseFileNameAndPath(item) {
      const nameWithoutExt = item.name.replace(/\.[^/.]+$/, "");
      const parts = nameWithoutExt.split(/\s+/);

      const wall = parts[0] || '未分類牆面';
      const color = parts[1] || '未分類顏色';
      const difficulty = parts[2] || '未分類難度';
      
      let person = parts[3] || '未指定人名';
      if (person.toLowerCase() === 'irene') person = 'Irene';

      const gymDate = item.folderName || '未分類播放清單';

      return {
        id: item.id,
        fullName: item.name,
        gymDate: gymDate,
        wall: wall,
        color: color,
        difficulty: difficulty,
        person: person,
        thumbnail: item.thumbnail || `https://i.ytimg.com/vi/${item.id}/hqdefault.jpg`,
        embedUrl: `https://www.youtube.com/embed/${item.id}?autoplay=1&rel=0`
      };
    }

    function processVideoData() {
      parsedVideoList = rawVideoList.map(item => parseFileNameAndPath(item));
      buildDynamicFiltersUI();
      renderVideoGrid();
    }

    function buildDynamicFiltersUI() {
      const filterWrapper = document.getElementById('filters-wrapper');
      filterWrapper.innerHTML = '';

      const filterConfigs = [
        { id: 'gymDate', label: '攀岩館/日期', icon: 'fa-location-dot', key: 'gymDate' },
        { id: 'person', label: '攀爬者', icon: 'fa-user', key: 'person' },
        { id: 'difficulty', label: '難度', icon: 'fa-gauge-high', key: 'difficulty' },
        { id: 'color', label: '石頭顏色', icon: 'fa-palette', key: 'color' },
        { id: 'wall', label: '牆面區域', icon: 'fa-layer-group', key: 'wall' }
      ];

      filterConfigs.forEach(cfg => {
        let availableVideos = parsedVideoList;

        if (cfg.key === 'wall' && activeFilters.gymDate !== 'ALL') {
          availableVideos = parsedVideoList.filter(v => v.gymDate === activeFilters.gymDate);
        }

        const uniqueValues = ['ALL', ...new Set(availableVideos.map(v => v[cfg.key]))].sort();

        const colDiv = document.createElement('div');
        colDiv.className = 'space-y-1.5';

        const label = document.createElement('label');
        label.className = 'block text-sm font-bold text-stone-700 flex items-center gap-1.5';
        label.innerHTML = `<i class="fa-solid ${cfg.icon} text-stone-500"></i> ${cfg.label}`;

        const select = document.createElement('select');
        select.className = 'w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm font-semibold text-stone-800 focus:outline-none focus:border-stone-400 focus:bg-white transition cursor-pointer shadow-sm';
        
        if (!uniqueValues.includes(activeFilters[cfg.key])) {
          activeFilters[cfg.key] = 'ALL';
        }
        select.value = activeFilters[cfg.key];

        uniqueValues.forEach(val => {
          const opt = document.createElement('option');
          opt.value = val;
          opt.textContent = val === 'ALL' ? `全部 ${cfg.label}` : val;
          select.appendChild(opt);
        });

        select.addEventListener('change', (e) => {
          activeFilters[cfg.key] = e.target.value;

          if (cfg.key === 'gymDate') {
            activeFilters.wall = 'ALL';
            buildDynamicFiltersUI();
          }

          renderVideoGrid();
          updateActiveTags();
        });

        colDiv.appendChild(label);
        colDiv.appendChild(select);
        filterWrapper.appendChild(colDiv);
      });

      updateActiveTags();
    }

    function updateActiveTags() {
      const tagsContainer = document.getElementById('active-tags');
      tagsContainer.innerHTML = '';

      let hasActive = false;
      const labelNames = { gymDate: '場館', person: '攀爬者', difficulty: '難度', color: '顏色', wall: '牆面' };

      Object.keys(activeFilters).forEach(k => {
        if (activeFilters[k] !== 'ALL') {
          hasActive = true;
          const tag = document.createElement('span');
          tag.className = 'bg-stone-100 text-stone-700 border border-stone-200 px-3 py-1 rounded-lg text-xs font-bold flex items-center gap-2 shadow-sm';
          tag.innerHTML = `${labelNames[k]}: ${activeFilters[k]} <i class="fa-solid fa-xmark cursor-pointer hover:text-stone-900" onclick="clearSingleFilter('${k}')"></i>`;
          tagsContainer.appendChild(tag);
        }
      });

      if (!hasActive) {
        tagsContainer.innerHTML = `<span class="text-stone-400 font-normal italic text-xs">全部分類</span>`;
      }
    }

    function clearSingleFilter(key) {
      activeFilters[key] = 'ALL';
      buildDynamicFiltersUI();
      renderVideoGrid();
    }

    function resetFilters() {
      activeFilters = { gymDate: 'ALL', person: 'ALL', difficulty: 'ALL', color: 'ALL', wall: 'ALL' };
      document.getElementById('search-input').value = '';
      searchQuery = '';
      buildDynamicFiltersUI();
      renderVideoGrid();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
      renderVideoGrid();
    }

    function renderVideoGrid() {
      const grid = document.getElementById('video-grid');
      grid.innerHTML = '';

      const filtered = parsedVideoList.filter(video => {
        const matchGym = activeFilters.gymDate === 'ALL' || video.gymDate === activeFilters.gymDate;
        const matchPerson = activeFilters.person === 'ALL' || video.person === activeFilters.person;
        const matchDiff = activeFilters.difficulty === 'ALL' || video.difficulty === activeFilters.difficulty;
        const matchColor = activeFilters.color === 'ALL' || video.color === activeFilters.color;
        const matchWall = activeFilters.wall === 'ALL' || video.wall === activeFilters.wall;
        const matchSearch = !searchQuery || video.fullName.toLowerCase().includes(searchQuery) || video.gymDate.toLowerCase().includes(searchQuery);

        return matchGym && matchPerson && matchDiff && matchColor && matchWall && matchSearch;
      });

      document.getElementById('displayed-count').innerText = filtered.length;
      document.getElementById('total-count').innerText = parsedVideoList.length;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-20 bg-white rounded-2xl border border-stone-200/80 shadow-sm">
            <i class="fa-solid fa-film text-4xl text-stone-300 mb-3"></i>
            <p class="text-stone-700 font-bold text-base">找不到符合條件的抱石影片</p>
            <p class="text-stone-400 text-sm mt-1">請嘗試調整篩選條件或搜尋關鍵字</p>
          </div>
        `;
        return;
      }

      filtered.forEach(video => {
        const badgeStyle = colorStyleMap[video.color] || 'bg-stone-100 text-stone-700 border-stone-200';

        const card = document.createElement('div');
        card.className = 'bg-white border border-stone-200/90 rounded-2xl overflow-hidden hover:border-stone-400 hover:shadow-md transition duration-200 flex flex-col group cursor-pointer';
        card.onclick = () => openVideoModal(video.id);

        card.innerHTML = `
          <div class="relative w-full aspect-video bg-stone-900 overflow-hidden border-b border-stone-100">
            <img src="${video.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300 opacity-90 group-hover:opacity-100" loading="lazy" alt="${video.fullName}">
            <div class="absolute inset-0 bg-stone-950/20 group-hover:bg-stone-950/10 transition flex items-center justify-center">
              <div class="w-12 h-12 rounded-full bg-red-600/90 text-white flex items-center justify-center shadow-lg group-hover:scale-110 transition duration-200">
                <i class="fa-solid fa-play text-base ml-1"></i>
              </div>
            </div>
            <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-md text-stone-700 text-xs font-bold px-3 py-1 rounded-lg border border-stone-200/80 shadow-sm">
              ${video.wall}
            </div>
          </div>

          <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
            <div>
              <div class="text-xs text-stone-500 font-bold flex items-center gap-1.5 mb-1.5">
                <i class="fa-solid fa-location-dot text-stone-400"></i> ${video.gymDate}
              </div>
              <h3 class="font-extrabold text-stone-800 text-base line-clamp-1 group-hover:text-stone-900 transition" title="${video.fullName}">
                ${video.fullName}
              </h3>
            </div>

            <div class="flex flex-wrap gap-2 pt-1">
              <span class="text-xs px-2.5 py-1 rounded-lg border ${badgeStyle} font-bold">${video.color}</span>
              <span class="text-xs px-2.5 py-1 rounded-lg border bg-stone-100 text-stone-700 border-stone-200 font-bold">${video.difficulty}</span>
              <span class="text-xs px-2.5 py-1 rounded-lg border bg-stone-100 text-stone-800 border-stone-200 font-bold flex items-center gap-1">
                <i class="fa-solid fa-user text-[10px] text-stone-500"></i> ${video.person}
              </span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openVideoModal(id) {
      const video = parsedVideoList.find(v => v.id === id);
      if (!video) return;

      document.getElementById('modal-title').innerText = video.fullName;
      document.getElementById('modal-iframe').src = video.embedUrl;
      
      const footer = document.getElementById('modal-footer');
      const badgeStyle = colorStyleMap[video.color] || 'bg-stone-100 text-stone-700 border-stone-200';

      footer.innerHTML = `
        <div class="flex flex-wrap gap-2 items-center text-xs font-bold">
          <span class="bg-stone-200/80 text-stone-800 px-3 py-1 rounded-lg"><i class="fa-solid fa-location-dot text-stone-500"></i> ${video.gymDate}</span>
          <span class="bg-stone-100 text-stone-700 px-3 py-1 rounded-lg border border-stone-200">${video.wall}</span>
          <span class="px-3 py-1 rounded-lg border ${badgeStyle}">${video.color}</span>
          <span class="bg-stone-100 text-stone-700 px-3 py-1 rounded-lg border border-stone-200">${video.difficulty}</span>
          <span class="bg-stone-200/80 text-stone-800 px-3 py-1 rounded-lg"><i class="fa-solid fa-user text-stone-500"></i> ${video.person}</span>
        </div>
        <a href="https://www.youtube.com/watch?v=${video.id}" target="_blank" class="text-red-600 hover:text-red-700 font-bold text-xs flex items-center gap-1 underline">
          在 YouTube 開啟 <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </a>
      `;

      renderSameRouteVideos(video);
      document.getElementById('video-modal').classList.remove('hidden');
    }

    function renderSameRouteVideos(currentVideo) {
      const grid = document.getElementById('same-route-grid');
      grid.innerHTML = '';

      const sameRoute = parsedVideoList.filter(v => 
        v.gymDate === currentVideo.gymDate &&
        v.wall === currentVideo.wall &&
        v.color === currentVideo.color &&
        v.difficulty === currentVideo.difficulty &&
        v.id !== currentVideo.id
      );

      if (sameRoute.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-stone-400 text-xs italic py-2">目前沒有這條路線其他人的影片。</div>`;
        return;
      }

      sameRoute.forEach(item => {
        const itemCard = document.createElement('div');
        itemCard.className = 'bg-stone-50 border border-stone-200 rounded-xl overflow-hidden hover:border-stone-400 transition cursor-pointer flex flex-col group p-2.5 space-y-2';
        itemCard.onclick = () => openVideoModal(item.id);

        itemCard.innerHTML = `
          <div class="relative w-full aspect-video bg-stone-900 rounded-lg overflow-hidden flex items-center justify-center">
            <img src="${item.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition">
            <div class="absolute inset-0 bg-stone-950/20 group-hover:bg-stone-950/10 flex items-center justify-center">
              <i class="fa-brands fa-youtube text-red-600 text-2xl group-hover:scale-110 transition"></i>
            </div>
          </div>
          <div class="flex justify-between items-center text-xs font-bold text-stone-700">
            <span class="truncate">${item.person}</span>
            <span class="text-[10px] text-stone-600 bg-stone-200/80 px-1.5 py-0.5 rounded">查看</span>
          </div>
        `;
        grid.appendChild(itemCard);
      });
    }

    function resizeModal(size) {
      const container = document.getElementById('modal-container');
      container.classList.remove('max-w-2xl', 'max-w-4xl', 'max-w-6xl', 'max-w-full');

      if (size === 'small') container.classList.add('max-w-2xl');
      else if (size === 'medium') container.classList.add('max-w-4xl');
      else if (size === 'large') container.classList.add('max-w-6xl');
      else if (size === 'full') container.classList.add('max-w-full', 'mx-4');
    }

    function closeVideoModal() {
      document.getElementById('video-modal').classList.add('hidden');
      document.getElementById('modal-iframe').src = '';
    }

    function openConfigModal() {
      document.getElementById('config-modal').classList.remove('hidden');
    }

    function closeConfigModal() {
      document.getElementById('config-modal').classList.add('hidden');
    }

    function saveConfig() {
      apiKey = document.getElementById('api-key-input').value.trim();
      channelId = document.getElementById('channel-id-input').value.trim();

      localStorage.setItem('yt_boulder_api_key', apiKey);
      localStorage.setItem('yt_boulder_channel_id', channelId);

      closeConfigModal();

      if (apiKey && channelId) {
        document.getElementById('demo-mode-banner').classList.add('hidden');
        fetchYouTubeData();
      } else {
        document.getElementById('demo-mode-banner').classList.remove('hidden');
        loadDemoData();
      }
    }

    // --- 核心：自動掃描頻道全播放清單 ---
    async function fetchYouTubeData() {
      if (!apiKey || !channelId) {
        openConfigModal();
        return;
      }

      const refreshIcon = document.getElementById('refresh-icon');
      refreshIcon.classList.add('fa-spin');

      try {
        rawVideoList = [];
        document.getElementById('channel-info').innerText = `正在讀取頻道播放清單...`;

        // 自動清理欄位中的空白與網址前綴
        let inputVal = channelId.trim();
        if (inputVal.includes('/channel/')) inputVal = inputVal.split('/channel/')[1].split('/')[0];
        if (inputVal.includes('/@')) inputVal = '@' + inputVal.split('/@')[1].split('/')[0];

        let targetChannelId = inputVal;

        // 1. 如果填入的是 @handle，先換算成真實的 UCu... Channel ID
        if (inputVal.startsWith('@')) {
          const handle = inputVal.replace('@', '');
          const cResp = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=id&forHandle=${handle}&key=${apiKey}`);
          const cData = await cResp.json();
          if (cData.items && cData.items.length > 0) {
            targetChannelId = cData.items[0].id;
          } else {
            throw new Error(`找不到控鍵號 @${handle} 對應的頻道`);
          }
        }

        // 2. 向 YouTube API 取得該頻道下「所有播放清單」
        const playlistsUrl = `https://www.googleapis.com/youtube/v3/playlists?part=snippet&channelId=${targetChannelId}&maxResults=50&key=${apiKey}`;
        const plResp = await fetch(playlistsUrl);
        const plData = await plResp.json();

        if (plData.error) {
          console.error("YouTube Playlists Error:", plData.error);
          throw new Error(`[API 錯誤 ${plData.error.code}] ${plData.error.message}`);
        }

        const playlists = plData.items || [];

        if (playlists.length === 0) {
          document.getElementById('channel-info').innerText = `頻道未找到播放清單`;
          alert('在您的頻道中找不到公開或不公開的「播放清單」！\n請確定影片已加入播放清單。');
          return;
        }

        // 3. 逐一讀取每個播放清單（播放清單名稱 = 攀岩館/日期）
        for (const pl of playlists) {
          const playlistTitle = pl.snippet.title;
          const playlistId = pl.id;

          const itemsUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${playlistId}&maxResults=50&key=${apiKey}`;
          const itemResp = await fetch(itemsUrl);
          const itemData = await itemResp.json();

          if (itemData.items) {
            itemData.items.forEach(item => {
              const videoId = item.snippet.resourceId.videoId;
              const videoTitle = item.snippet.title;
              const thumbnails = item.snippet.thumbnails;
              const thumbUrl = (thumbnails.high || thumbnails.medium || thumbnails.default)?.url;

              rawVideoList.push({
                id: videoId,
                name: videoTitle,
                folderName: playlistTitle,
                thumbnail: thumbUrl
              });
            });
          }
        }

        document.getElementById('channel-info').innerText = `成功讀取 ${playlists.length} 個播放清單，共 ${rawVideoList.length} 支影片`;
        processVideoData();

      } catch (err) {
        console.error('Fetch YouTube API Error:', err);
        alert(`存取 YouTube Data API 失敗！\n\n原因：${err.message}`);
      } finally {
        refreshIcon.classList.remove('fa-spin');
      }
    }
  </script>
</body>
