<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧗‍♂️ 抱石影片紀錄庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #faf8f5;
      color: #2d3748;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f0ea;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md border-b border-stone-200/80 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3.5 cursor-pointer" onclick="showGymOverview()">
        <div class="bg-red-600 p-2.5 rounded-2xl text-white shadow-sm">
          <i class="fa-brands fa-youtube text-lg"></i>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-stone-800">
            抱石影片紀錄
          </h1>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div id="local-mode-tag" class="hidden text-xs font-bold bg-amber-100 text-amber-800 px-3 py-1.5 rounded-xl border border-amber-200">
          ⚡ 本地測試模式
        </div>
        <button id="refresh-btn" onclick="initApp()" class="flex items-center gap-2 bg-stone-800 hover:bg-stone-700 text-white text-sm px-4 py-2 rounded-xl transition font-bold shadow-sm">
          <i class="fa-solid fa-arrows-rotate" id="refresh-icon"></i>
          <span class="hidden sm:inline">重新同步</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- 第一層：岩館分類主頁面 (Home Section) -->
    <section id="gym-overview-section" class="space-y-10">
      <div class="border-b border-stone-200 pb-4 flex justify-between items-end">
        <div>
          <h2 class="text-xl sm:text-2xl font-black text-stone-800">攀岩館列表</h2>
          <p class="text-stone-500 text-sm mt-1">按最新紀錄時間由近至遠排序</p>
        </div>
        <div id="gym-count-badge" class="text-xs font-bold bg-stone-200 text-stone-700 px-3 py-1.5 rounded-xl">載入中...</div>
      </div>

      <div id="gym-list-container" class="space-y-12"></div>
    </section>

    <!-- 第二層：單一岩館詳細資料頁面 (Detail Section) -->
    <section id="gym-detail-section" class="hidden space-y-8">
      
      <!-- 頂部區塊 -->
      <div class="bg-white p-6 rounded-2xl border border-stone-200/80 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <div class="text-xs font-bold text-red-600 mb-1 flex items-center gap-1">
            <i class="fa-solid fa-location-dot"></i> 當前攀岩館
          </div>
          <h2 id="current-gym-name" class="text-2xl sm:text-3xl font-black text-stone-800">岩館名稱</h2>
        </div>

        <div class="flex flex-col items-start sm:items-end gap-2 w-full sm:w-auto">
          <div class="text-sm font-bold text-stone-500">
            共 <span id="displayed-count" class="font-black text-stone-800 text-base">0</span> / <span id="total-count" class="font-black text-stone-800 text-base">0</span> 支影片
          </div>
          <button onclick="showGymOverview()" class="bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs sm:text-sm font-bold px-4 py-2 rounded-xl transition border border-stone-200 flex items-center gap-2 shadow-sm">
            <i class="fa-solid fa-arrow-left"></i>
            <span>返回岩館總覽</span>
          </button>
        </div>
      </div>

      <!-- 篩選控制面板 -->
      <section class="bg-white rounded-2xl p-6 border border-stone-200/80 shadow-sm space-y-6">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-stone-100 pb-5">
          <h3 class="text-base font-bold text-stone-700 flex items-center gap-2">
            <i class="fa-solid fa-sliders text-stone-500"></i> 動態多維度篩選
          </h3>
          
          <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="relative flex-1 md:w-64">
              <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 text-sm"></i>
              <input type="text" id="search-input" oninput="handleSearch()" placeholder="搜尋關鍵字..." class="w-full bg-stone-50 border border-stone-200 rounded-xl pl-10 pr-4 py-2 text-sm text-stone-800 placeholder-stone-400 focus:outline-none focus:border-stone-400 focus:bg-white transition">
            </div>
            <button onclick="resetFilters()" class="text-sm font-medium text-stone-600 hover:text-stone-900 flex items-center gap-2 px-3.5 py-2 rounded-xl border border-stone-200 bg-stone-50 transition">
              <i class="fa-solid fa-rotate-left text-xs"></i> 重置
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4" id="filters-wrapper"></div>

        <div id="active-tags-container" class="flex flex-wrap items-center gap-2 pt-1 text-sm text-stone-600 min-h-[32px]">
          <span class="font-medium text-stone-400">已選條件：</span>
          <div id="active-tags" class="flex flex-wrap gap-2"></div>
        </div>
      </section>

      <!-- 影片卡片網格 -->
      <section id="video-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-4 gap-4 sm:gap-6"></section>
    </section>

  </main>

  <!-- 💡 重新結構優化的 Modal (確保底部影片卡片不被截斷) -->
  <div id="video-modal" class="fixed inset-0 z-50 bg-stone-900/80 backdrop-blur-md hidden flex items-center justify-center p-2 sm:p-4 transition-all duration-300">
    <div id="modal-container" class="bg-white border border-stone-200 rounded-2xl overflow-hidden max-w-3xl w-full max-h-[96vh] shadow-2xl relative flex flex-col justify-between">
      
      <!-- 1. 頂部標籤與按鈕 (固定高度) -->
      <div class="p-3 border-b border-stone-100 flex justify-between items-center bg-stone-50/90 flex-shrink-0 gap-2">
        <div id="modal-tags-header" class="flex flex-wrap items-center gap-1.5 sm:gap-2 text-xs sm:text-sm font-bold overflow-hidden pr-2">
          <!-- JS 動態插入標籤 -->
        </div>
        
        <div class="flex items-center gap-2 flex-shrink-0">
          <a id="modal-yt-link" href="#" target="_blank" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-3 py-1 rounded-lg text-xs sm:text-sm font-bold flex items-center gap-1 transition">
            <span>YouTube 開啟</span>
            <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
          </a>
          <button onclick="closeVideoModal()" class="text-stone-400 hover:text-stone-700 p-1 rounded-xl hover:bg-stone-100 transition">
            <i class="fa-solid fa-xmark text-2xl"></i>
          </button>
        </div>
      </div>

      <!-- 2. 💡 中間主影片播放區 (自動配合視窗調整，但絕不排擠底部空間) -->
      <div class="relative w-full bg-black flex items-center justify-center overflow-hidden py-2 min-h-[300px] max-h-[62vh] flex-shrink flex-grow">
        <iframe id="modal-iframe" src="" class="h-full aspect-[9/16] max-w-[360px] sm:max-w-md border-0 shadow-2xl rounded-lg" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <!-- 3. 💡 底部同場館同路線影片區 (強迫保證 min-h-[160px]，絕對不被被截掉名字) -->
      <div class="p-3.5 bg-white border-t border-stone-100 space-y-2 overflow-y-auto custom-scrollbar min-h-[160px] max-h-[280px] flex-shrink-0">
        <h4 class="text-xs font-extrabold text-stone-800 flex items-center gap-1.5">
          <i class="fa-solid fa-users-viewfinder text-stone-500 text-sm"></i> 同場館同路線影片：
        </h4>
        <div id="same-route-grid" class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 gap-2.5 pb-2"></div>
      </div>
    </div>
  </div>

  <script>
    const isLocalhost = window.location.hostname === 'localhost' || 
                        window.location.hostname === '127.0.0.1' || 
                        window.location.protocol === 'file:';

    const PRODUCTION_API_KEY = 'AIzaSyAJ_5wsSXdf52qSkMyLYCjVuw57HJ6fipw';
    const channelId = 'UCUFu4m0t1GNp4ZKYAnsODjg';

    let apiKey = PRODUCTION_API_KEY;

    const MOCK_PLAYLISTS = [
      {
        id: "mock_pl_1",
        snippet: {
          title: "20260726 B-Plus(太原店)",
          thumbnails: { high: { url: "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" } }
        }
      },
      {
        id: "mock_pl_2",
        snippet: {
          title: "20260719 攀呐",
          thumbnails: { high: { url: "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" } }
        }
      }
    ];

    const MOCK_VIDEOS = [
      { id: "dQw4w9WgXcQ", name: "1F 藍石2 挑戰 嘉", date: "20260726", gymName: "B-Plus(太原店)", thumbnail: "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" },
      { id: "dQw4w9WgXcQ", name: "1F 藍石2 挑戰 Irene", date: "20260726", gymName: "B-Plus(太原店)", thumbnail: "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" },
      { id: "dQw4w9WgXcQ", name: "1F 藍石2 挑戰 峰", date: "20260726", gymName: "B-Plus(太原店)", thumbnail: "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" },
      { id: "dQw4w9WgXcQ", name: "1F 藍石2 挑戰 MoTang", date: "20260726", gymName: "B-Plus(太原店)", thumbnail: "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" },
      { id: "dQw4w9WgXcQ", name: "2F 黃石 挑戰 嘉", date: "20260726", gymName: "B-Plus(太原店)", thumbnail: "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" },
      { id: "dQw4w9WgXcQ", name: "C面 桃石 V1 嘉", date: "20260719", gymName: "攀呐", thumbnail: "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" }
    ];

    let allPlaylists = [];
    let gymGroupedMap = {};
    let currentGymName = '';
    let currentGymVideos = [];
    let parsedVideoList = [];
    
    let activeFilters = { date: 'ALL', person: 'ALL', difficulty: 'ALL', color: 'ALL', wall: 'ALL' };
    let searchQuery = '';

    const colorStyleMap = {
      '桃石': 'bg-rose-50 text-rose-700 border-rose-200',
      '紅石': 'bg-red-50 text-red-700 border-red-200',
      '綠石': 'bg-emerald-50 text-emerald-700 border-emerald-200',
      '橘石': 'bg-orange-50 text-orange-700 border-orange-200',
      '藍石': 'bg-sky-50 text-sky-700 border-sky-200',
      '淺黃石': 'bg-amber-50 text-amber-700 border-amber-200',
      '黃石': 'bg-yellow-50 text-yellow-800 border-yellow-200',
      '黑石': 'bg-stone-800 text-stone-100 border-stone-800',
      '紫石': 'bg-purple-50 text-purple-700 border-purple-200',
      '粉紅石': 'bg-pink-50 text-pink-700 border-pink-200'
    };

    window.addEventListener('DOMContentLoaded', () => {
      if (isLocalhost) {
        document.getElementById('local-mode-tag').classList.remove('hidden');
      }
      initApp();
    });

    async function initApp() {
      const refreshIcon = document.getElementById('refresh-icon');
      refreshIcon.classList.add('fa-spin');

      try {
        const playlistsUrl = `https://www.googleapis.com/youtube/v3/playlists?part=snippet&channelId=${channelId}&maxResults=50&key=${apiKey}`;
        const plResp = await fetch(playlistsUrl);
        const plData = await plResp.json();

        if (plData.error) throw new Error(plData.error.message);

        allPlaylists = plData.items || [];
        processGymGroups();
        showGymOverview();

      } catch (err) {
        console.warn('API 連線不可用或處於本地測試，啟動 Mock Data 模式:', err.message);
        allPlaylists = MOCK_PLAYLISTS;
        processGymGroups();
        showGymOverview();
      } finally {
        refreshIcon.classList.remove('fa-spin');
      }
    }

    function processGymGroups() {
      gymGroupedMap = {};

      allPlaylists.forEach(pl => {
        const title = pl.snippet.title.trim();
        const parts = title.split(/\s+/);
        
        let dateStr = parts[0] || '未分類日期';
        let gymName = parts.slice(1).join(' ') || '未分類岩館';

        if (!gymGroupedMap[gymName]) {
          gymGroupedMap[gymName] = {
            gymName: gymName,
            latestDate: dateStr,
            playlists: []
          };
        }

        if (dateStr > gymGroupedMap[gymName].latestDate) {
          gymGroupedMap[gymName].latestDate = dateStr;
        }

        gymGroupedMap[gymName].playlists.push({
          id: pl.id,
          title: title,
          date: dateStr,
          thumbnail: pl.snippet.thumbnails?.high?.url || pl.snippet.thumbnails?.medium?.url
        });
      });

      Object.keys(gymGroupedMap).forEach(gym => {
        gymGroupedMap[gym].playlists.sort((a, b) => b.date.localeCompare(a.date));
      });
    }

    function showGymOverview() {
      document.getElementById('gym-overview-section').classList.remove('hidden');
      document.getElementById('gym-detail-section').classList.add('hidden');

      const container = document.getElementById('gym-list-container');
      container.innerHTML = '';

      const sortedGyms = Object.values(gymGroupedMap).sort((a, b) => b.latestDate.localeCompare(a.latestDate));
      document.getElementById('gym-count-badge').innerText = `共 ${sortedGyms.length} 間攀岩館`;

      for (const gym of sortedGyms) {
        const gymCard = document.createElement('div');
        gymCard.className = 'bg-white rounded-2xl p-6 border border-stone-200/80 shadow-sm space-y-4';

        gymCard.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-stone-100 pb-3">
            <div>
              <h3 class="text-xl font-extrabold text-stone-800">${gym.gymName}</h3>
              <p class="text-xs font-semibold text-stone-400 mt-0.5">最新攀爬紀錄：${gym.latestDate} · 共 ${gym.playlists.length} 次紀錄</p>
            </div>
            <button onclick="enterGymDetail('${gym.gymName}')" class="self-start sm:self-auto bg-stone-800 hover:bg-stone-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition flex items-center gap-1.5 shadow-sm">
              <span>進入場館查看完整紀錄</span>
              <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-3" id="preview-grid-${gym.gymName.replace(/\s+/g, '-')}">
            <div class="col-span-full py-6 text-center text-xs text-stone-400 font-bold">預覽載入中...</div>
          </div>
        `;
        container.appendChild(gymCard);

        loadGymPreviewVideos(gym.gymName, gym.playlists[0].id);
      }
    }

    async function loadGymPreviewVideos(gymName, latestPlaylistId) {
      const targetGrid = document.getElementById(`preview-grid-${gymName.replace(/\s+/g, '-')}`);
      if (!targetGrid) return;

      try {
        const itemsUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${latestPlaylistId}&maxResults=6&key=${apiKey}`;
        const resp = await fetch(itemsUrl);
        const data = await resp.json();

        targetGrid.innerHTML = '';
        if (data.items && data.items.length > 0) {
          data.items.forEach(item => {
            const title = item.snippet.title;
            const thumb = (item.snippet.thumbnails.medium || item.snippet.thumbnails.default)?.url;
            const videoId = item.snippet.resourceId.videoId;
            renderPreviewCard(targetGrid, videoId, title, gymName, thumb);
          });
        } else {
          renderMockPreviewCards(targetGrid, gymName);
        }
      } catch (err) {
        renderMockPreviewCards(targetGrid, gymName);
      }
    }

    function renderMockPreviewCards(targetGrid, gymName) {
      targetGrid.innerHTML = '';
      const localGymVideos = MOCK_VIDEOS.filter(v => v.gymName === gymName);
      localGymVideos.forEach(v => {
        renderPreviewCard(targetGrid, v.id, v.name, gymName, v.thumbnail);
      });
    }

    function renderPreviewCard(container, videoId, title, gymName, thumb) {
      const card = document.createElement('div');
      card.className = 'bg-stone-50 rounded-xl overflow-hidden border border-stone-200/80 group cursor-pointer hover:border-stone-400 transition';
      card.onclick = () => openVideoModalDirectly(videoId, title, gymName);

      card.innerHTML = `
        <div class="relative aspect-[9/16] bg-stone-900 overflow-hidden">
          <img src="${thumb}" class="w-full h-full object-cover group-hover:scale-105 transition">
          <div class="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition flex items-center justify-center">
            <div class="w-8 h-8 rounded-full bg-red-600/90 text-white flex items-center justify-center shadow-md group-hover:scale-110 transition">
              <i class="fa-solid fa-play text-xs ml-0.5"></i>
            </div>
          </div>
        </div>
        <div class="p-2">
          <p class="text-xs font-bold text-stone-800 line-clamp-1">${title}</p>
        </div>
      `;
      container.appendChild(card);
    }

    async function enterGymDetail(gymName) {
      currentGymName = gymName;
      document.getElementById('gym-overview-section').classList.add('hidden');
      document.getElementById('gym-detail-section').classList.remove('hidden');
      document.getElementById('current-gym-name').innerText = gymName;

      const refreshIcon = document.getElementById('refresh-icon');
      refreshIcon.classList.add('fa-spin');

      try {
        currentGymVideos = [];
        const gymInfo = gymGroupedMap[gymName];

        for (const pl of gymInfo.playlists) {
          const itemsUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${pl.id}&maxResults=50&key=${apiKey}`;
          const itemResp = await fetch(itemsUrl);
          const itemData = await itemResp.json();

          if (itemData.items) {
            itemData.items.forEach(item => {
              currentGymVideos.push({
                id: item.snippet.resourceId.videoId,
                name: item.snippet.title,
                date: pl.date,
                gymName: gymName,
                thumbnail: (item.snippet.thumbnails.high || item.snippet.thumbnails.medium)?.url
              });
            });
          }
        }

        if (currentGymVideos.length === 0) throw new Error('No online videos found');

      } catch (err) {
        currentGymVideos = MOCK_VIDEOS.filter(v => v.gymName === gymName);
      } finally {
        parsedVideoList = currentGymVideos.map(item => parseFileNameAndPath(item));
        resetFilters();
        refreshIcon.classList.remove('fa-spin');
      }
    }

    function parseFileNameAndPath(item) {
      const nameWithoutExt = item.name.replace(/\.[^/.]+$/, "");
      const parts = nameWithoutExt.split(/\s+/);

      const wall = parts[0] || '未分類牆面';
      const color = parts[1] || '未分類顏色';
      const difficulty = parts[2] || '未分類難度';
      
      let person = parts[3] || '未指定人名';
      if (person.toLowerCase() === 'irene') person = 'Irene';

      return {
        id: item.id,
        fullName: item.name,
        date: item.date,
        gymName: item.gymName,
        wall: wall,
        color: color,
        difficulty: difficulty,
        person: person,
        thumbnail: item.thumbnail || `https://i.ytimg.com/vi/${item.id}/hqdefault.jpg`,
        embedUrl: `https://www.youtube.com/embed/${item.id}?autoplay=1&rel=0`
      };
    }

    function buildDynamicFiltersUI() {
      const filterWrapper = document.getElementById('filters-wrapper');
      filterWrapper.innerHTML = '';

      const filterConfigs = [
        { id: 'date', label: '紀錄日期', icon: 'fa-calendar-days', key: 'date' },
        { id: 'person', label: '攀爬者', icon: 'fa-user', key: 'person' },
        { id: 'difficulty', label: '難度', icon: 'fa-gauge-high', key: 'difficulty' },
        { id: 'color', label: '石頭顏色', icon: 'fa-palette', key: 'color' },
        { id: 'wall', label: '牆面區域', icon: 'fa-layer-group', key: 'wall' }
      ];

      filterConfigs.forEach(cfg => {
        let availableVideos = parsedVideoList;

        if (cfg.key === 'wall' && activeFilters.date !== 'ALL') {
          availableVideos = parsedVideoList.filter(v => v.date === activeFilters.date);
        }

        const itemValues = [...new Set(availableVideos.map(v => v[cfg.key]))].sort();
        const uniqueValues = ['ALL', ...itemValues];

        if (!uniqueValues.includes(activeFilters[cfg.key])) {
          activeFilters[cfg.key] = 'ALL';
        }

        const colDiv = document.createElement('div');
        colDiv.className = 'space-y-1.5';

        const label = document.createElement('label');
        label.className = 'block text-sm font-bold text-stone-700 flex items-center gap-1.5';
        label.innerHTML = `<i class="fa-solid ${cfg.icon} text-stone-500"></i> ${cfg.label}`;

        const select = document.createElement('select');
        select.className = 'w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm font-semibold text-stone-800 focus:outline-none focus:border-stone-400 focus:bg-white transition cursor-pointer shadow-sm';

        uniqueValues.forEach(val => {
          const opt = document.createElement('option');
          opt.value = val;
          opt.textContent = val === 'ALL' ? `全部 ${cfg.label}` : val;
          select.appendChild(opt);
        });

        select.value = activeFilters[cfg.key];

        select.addEventListener('change', (e) => {
          activeFilters[cfg.key] = e.target.value;

          if (cfg.key === 'date') {
            activeFilters.wall = 'ALL';
            buildDynamicFiltersUI();
          }

          renderVideoGrid();
          updateActiveTags();
        });

        colDiv.appendChild(label);
        colDiv.appendChild(select);
        filterWrapper.appendChild(colDiv);
      });

      updateActiveTags();
    }

    function updateActiveTags() {
      const tagsContainer = document.getElementById('active-tags');
      tagsContainer.innerHTML = '';

      let hasActive = false;
      const labelNames = { date: '日期', person: '攀爬者', difficulty: '難度', color: '顏色', wall: '牆面' };

      Object.keys(activeFilters).forEach(k => {
        if (activeFilters[k] !== 'ALL') {
          hasActive = true;
          const tag = document.createElement('span');
          tag.className = 'bg-stone-100 text-stone-700 border border-stone-200 px-3 py-1 rounded-lg text-xs font-bold flex items-center gap-2 shadow-sm';
          tag.innerHTML = `${labelNames[k]}: ${activeFilters[k]} <i class="fa-solid fa-xmark cursor-pointer hover:text-stone-900" onclick="clearSingleFilter('${k}')"></i>`;
          tagsContainer.appendChild(tag);
        }
      });

      if (!hasActive) {
        tagsContainer.innerHTML = `<span class="text-stone-400 font-normal italic text-xs">全部分類</span>`;
      }
    }

    function clearSingleFilter(key) {
      activeFilters[key] = 'ALL';
      buildDynamicFiltersUI();
      renderVideoGrid();
    }

    function resetFilters() {
      activeFilters = { date: 'ALL', person: 'ALL', difficulty: 'ALL', color: 'ALL', wall: 'ALL' };
      document.getElementById('search-input').value = '';
      searchQuery = '';
      buildDynamicFiltersUI();
      renderVideoGrid();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
      renderVideoGrid();
    }

    function renderVideoGrid() {
      const grid = document.getElementById('video-grid');
      grid.innerHTML = '';

      const filtered = parsedVideoList.filter(video => {
        const matchDate = activeFilters.date === 'ALL' || video.date === activeFilters.date;
        const matchPerson = activeFilters.person === 'ALL' || video.person === activeFilters.person;
        const matchDiff = activeFilters.difficulty === 'ALL' || video.difficulty === activeFilters.difficulty;
        const matchColor = activeFilters.color === 'ALL' || video.color === activeFilters.color;
        const matchWall = activeFilters.wall === 'ALL' || video.wall === activeFilters.wall;
        const matchSearch = !searchQuery || video.fullName.toLowerCase().includes(searchQuery) || video.date.toLowerCase().includes(searchQuery);

        return matchDate && matchPerson && matchDiff && matchColor && matchWall && matchSearch;
      });

      document.getElementById('displayed-count').innerText = filtered.length;
      document.getElementById('total-count').innerText = parsedVideoList.length;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-20 bg-white rounded-2xl border border-stone-200/80 shadow-sm">
            <i class="fa-solid fa-film text-4xl text-stone-300 mb-3"></i>
            <p class="text-stone-700 font-bold text-base">找不到符合條件的抱石影片</p>
            <p class="text-stone-400 text-sm mt-1">請嘗試調整篩選條件或搜尋關鍵字</p>
          </div>
        `;
        return;
      }

      filtered.forEach(video => {
        const badgeStyle = colorStyleMap[video.color] || 'bg-stone-100 text-stone-700 border-stone-200';

        const card = document.createElement('div');
        card.className = 'bg-white border border-stone-200/90 rounded-2xl overflow-hidden hover:border-stone-400 hover:shadow-md transition duration-200 flex flex-col group cursor-pointer';
        card.onclick = () => openVideoModal(video.id);

        card.innerHTML = `
          <div class="relative w-full aspect-[9/16] bg-stone-900 overflow-hidden border-b border-stone-100">
            <img src="${video.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300 opacity-90 group-hover:opacity-100" loading="lazy" alt="${video.fullName}">
            <div class="absolute inset-0 bg-stone-950/20 group-hover:bg-stone-950/10 transition flex items-center justify-center">
              <div class="w-10 h-10 rounded-full bg-red-600/90 text-white flex items-center justify-center shadow-lg group-hover:scale-110 transition duration-200">
                <i class="fa-solid fa-play text-sm ml-0.5"></i>
              </div>
            </div>
            <div class="absolute top-2.5 left-2.5 bg-white/95 backdrop-blur-md text-stone-800 text-xs font-black px-2.5 py-1 rounded-lg border border-stone-200/80 shadow-sm">
              ${video.wall}
            </div>
          </div>

          <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
            <div>
              <div class="text-xs text-stone-400 font-bold flex items-center gap-1 mb-1.5">
                <i class="fa-solid fa-calendar-days"></i> ${video.date}
              </div>
              <h3 class="font-black text-stone-800 text-base line-clamp-1 group-hover:text-red-600 transition" title="${video.fullName}">
                ${video.fullName}
              </h3>
            </div>

            <div class="flex flex-wrap gap-1.5 pt-0.5">
              <span class="text-xs px-2.5 py-1 rounded-md border ${badgeStyle} font-bold shadow-xs">${video.color}</span>
              <span class="text-xs px-2.5 py-1 rounded-md border bg-stone-100 text-stone-700 border-stone-200 font-bold shadow-xs">${video.difficulty}</span>
              <span class="text-xs px-2.5 py-1 rounded-md border bg-stone-100 text-stone-800 border-stone-200 font-bold shadow-xs">${video.person}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openVideoModal(id) {
      const video = parsedVideoList.find(v => v.id === id);
      if (!video) return;

      document.getElementById('modal-iframe').src = video.embedUrl;
      document.getElementById('modal-yt-link').href = `https://www.youtube.com/watch?v=${video.id}`;

      const tagsHeader = document.getElementById('modal-tags-header');
      const badgeStyle = colorStyleMap[video.color] || 'bg-stone-100 text-stone-700 border-stone-200';

      tagsHeader.innerHTML = `
        <span class="bg-stone-100 text-stone-800 px-3 py-1 rounded-lg border border-stone-200">${video.gymName} (${video.date})</span>
        <span class="bg-stone-100 text-stone-700 px-3 py-1 rounded-lg border border-stone-200">${video.wall}</span>
        <span class="px-3 py-1 rounded-lg border ${badgeStyle}">${video.color}</span>
        <span class="bg-stone-100 text-stone-700 px-3 py-1 rounded-lg border border-stone-200">${video.difficulty}</span>
        <span class="bg-stone-200/80 text-stone-800 px-3 py-1 rounded-lg">${video.person}</span>
      `;

      renderSameRouteVideos(video);
      document.getElementById('video-modal').classList.remove('hidden');
    }

    function openVideoModalDirectly(videoId, title, gymName) {
      document.getElementById('modal-iframe').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
      document.getElementById('modal-yt-link').href = `https://www.youtube.com/watch?v=${videoId}`;
      
      const targetVideo = MOCK_VIDEOS.find(v => v.id === videoId && v.gymName === gymName) || {
        wall: '1F',
        color: '藍石2',
        difficulty: '挑戰',
        person: '嘉',
        date: '20260726',
        gymName: gymName,
        id: videoId
      };

      const parsedTarget = parseFileNameAndPath(targetVideo);
      const badgeStyle = colorStyleMap[parsedTarget.color] || 'bg-stone-100 text-stone-700 border-stone-200';

      document.getElementById('modal-tags-header').innerHTML = `
        <span class="bg-stone-100 text-stone-800 px-3 py-1 rounded-lg border border-stone-200">${parsedTarget.gymName} (${parsedTarget.date})</span>
        <span class="bg-stone-100 text-stone-700 px-3 py-1 rounded-lg border border-stone-200">${parsedTarget.wall}</span>
        <span class="px-3 py-1 rounded-lg border ${badgeStyle}">${parsedTarget.color}</span>
        <span class="bg-stone-100 text-stone-700 px-3 py-1 rounded-lg border border-stone-200">${parsedTarget.difficulty}</span>
        <span class="bg-stone-200/80 text-stone-800 px-3 py-1 rounded-lg">${parsedTarget.person}</span>
      `;

      const sourceList = parsedVideoList.length > 0 ? parsedVideoList : MOCK_VIDEOS.map(v => parseFileNameAndPath(v));
      renderSameRouteVideos(parsedTarget, sourceList);

      document.getElementById('video-modal').classList.remove('hidden');
    }

    function renderSameRouteVideos(currentVideo, sourceList = parsedVideoList) {
      const grid = document.getElementById('same-route-grid');
      grid.innerHTML = '';

      const sameRoute = sourceList.filter(v => 
        v.wall === currentVideo.wall &&
        v.color === currentVideo.color &&
        v.difficulty === currentVideo.difficulty &&
        v.person !== currentVideo.person
      );

      if (sameRoute.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-stone-400 text-xs italic py-1">無其他攀爬者紀錄。</div>`;
        return;
      }

      sameRoute.forEach(item => {
        const itemCard = document.createElement('div');
        itemCard.className = 'bg-stone-50 border border-stone-200 rounded-lg overflow-hidden hover:border-stone-400 transition cursor-pointer flex flex-col group p-1.5 space-y-1';
        itemCard.onclick = () => openVideoModal(item.id);

        itemCard.innerHTML = `
          <div class="relative w-full aspect-[9/16] bg-stone-900 rounded overflow-hidden flex-shrink-0">
            <img src="${item.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition">
            <div class="absolute inset-0 bg-stone-950/20 group-hover:bg-stone-950/10 flex items-center justify-center">
              <i class="fa-brands fa-youtube text-red-600 text-sm group-hover:scale-110 transition"></i>
            </div>
          </div>
          <div class="text-[11px] font-bold text-stone-700 truncate text-center leading-normal py-0.5">
            ${item.person}
          </div>
        `;
        grid.appendChild(itemCard);
      });
    }

    function closeVideoModal() {
      document.getElementById('video-modal').classList.add('hidden');
      document.getElementById('modal-iframe').src = '';
    }
  </script>
</body>
</html>
